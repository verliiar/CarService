services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: car_service
      POSTGRES_USER: car_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U car_service -d car_service"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      Database__ConnectionString: Host=postgres;Database=car_service;Username=car_service;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Database__MigrateOnStartup: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY to a random value of at least 32 characters}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BootstrapAdmin__ExistingUserId: ${BOOTSTRAP_ADMIN_EXISTING_USER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
